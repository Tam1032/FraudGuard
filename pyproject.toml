[project]
name = "fraudguard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "evidently>=0.7.20,<0.8",
    "fastapi>=0.115",
    "httpx>=0.27",
    "joblib>=1.4",
    "lightgbm>=4.7",
    "mlflow>=3.0",
    "numba>=0.60",
    "numpy>=1.26",
    "pandas>=2.2,<3",
    "pyarrow>=15",
    "pydantic>=2.7",
    "pytest>=8",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:Using .httpx.:UserWarning",
]